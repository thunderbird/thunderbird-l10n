# LOCALIZATION NOTE (start.suffix):
# datetimes followed by these are extracted as start times
start.suffix = līdz | - | un
# LOCALIZATION NOTE (end.prefix):
# datetimes with these in front are extracted as end times
end.prefix = līdz | līdz | līdz | - | līdz | līdz | un | termiņš: | termiņš | beidzas | termiņš ir | termiņš:
# LOCALIZATION NOTE (no.datetime.prefix):
# datetimes with these in front won't be used
# specify full words here
no.datetime.prefix = iepriekšējā nedēļā | nosūtīts | e-pasta adrese | e-pasts | vietā | > | diemžēl | iekšā | ne
# LOCALIZATION NOTE (no.datetime.suffix):
# datetimes followed by these won't be used
no.datetime.suffix = stāvs | st. | : | e-pasts | e-pasta adrese | > | % | usd | dolāri | $
# LOCALIZATION NOTE (from.today):
# must not be empty!
from.today = šodien
from.tomorrow = rīt
# LOCALIZATION NOTE (from.ordinal.date):
##1 = matches numbers 1-31 and number.x
# should not have "#1" as this would match any single number in email to a time
from.ordinal.date = #1. | #1. | #1. | #1. | #1. vieta
from.noon = pusdienlaiks
# LOCALIZATION NOTE (from.hour):
##1 = matches numbers 0-23 and number.0-number.23
# should not have "#1" as this would match any single number in email to a time
from.hour = 1. vietā | ap 1. vietu | 1. vieta — | 1. vieta līdz
# LOCALIZATION NOTE (until.hour):
##1 = matches numbers 0-23 and number.0-number.23
# should also list how to find end of a timeframe
until.hour = - #1 | līdz #1 | līdz #1 | pēc #1
# LOCALIZATION NOTE (from.hour.am):
##1 = matches numbers 0-23 and number.0-number.23
from.hour.am = #1 no rīta | #1 no rīta
# LOCALIZATION NOTE (from.hour.pm):
##1 = matches numbers 0-23 and number.0-number.23
from.hour.pm = #13:00 | #13:00 | #13:00
# LOCALIZATION NOTE (from.half.hour.before):
# denotes times 30 minutes before next full hour
from.half.hour.before = pusstundu pirms #1
# LOCALIZATION NOTE (from.half.hour.after):
# denotes times 30 minutes after last full hour
from.half.hour.after = pusstundu pēc #1
# LOCALIZATION NOTE (from.hour.minutes):
##1 = matches numbers 0-23
##2 = matches numbers 0-59
from.hour.minutes = #1:#2 | pie #1#2
# LOCALIZATION NOTE (from.hour.minutes.am):
##1 = matches numbers 0-23
##2 = matches numbers 0-59
from.hour.minutes.am = #1:#2:00 | #1:#2:00
# LOCALIZATION NOTE (from.month.day):
##1 = matches numbers 1-31
##2 = matches numbers 1-12
from.month.day = #1.#2.
# LOCALIZATION NOTE (month.*):
# can be a list of values, separate variants by |
month.1 = janvāris | jan | jan.
month.2 = februāris | feb | feb.
month.3 = marts | mar | mar.
month.4 = aprīlis | apr | apr.
month.5 = maijs
month.6 = jūnijs | jūnijs | jūn.
month.7 = jūlijs | jūl | jūl.
month.8 = augusts | aug | aug.
month.9 = septembris | sep | sep. | sept.
month.10 = oktobris | okt | okt.
month.11 = novembris | nov | nov.
month.12 = decembris | dec | dec.
# LOCALIZATION NOTE (from.weekday.*):
# used to derive start date based on weekdays mentioned
# can be a list of values, separate variants by |
# LOCALIZATION NOTE (from.weekday.0):
# Regardless of what the first day of the week is in your country, 0 is Sunday here.
from.weekday.0 = svētdiena | svētdienās
from.weekday.1 = pirmdiena | pirmdienās
from.weekday.2 = otrdiena | otrdienas
from.weekday.3 = trešdiena | trešdienas
from.weekday.4 = ceturtdiena | ceturtdienas
from.weekday.5 = piektdiena | piektdienas
from.weekday.6 = sestdiena | sestdienas
# LOCALIZATION NOTE (number.*):
# used within other patterns to understand dates where day of month isn't written with digits
# can be a list of values, separate variants by |
number.0 = nulle
number.1 = viens | pirmais
number.2 = divi | otrais
number.3 = trīs | trešais
number.4 = četri | ceturtais
number.5 = pieci | piektais
number.6 = seši | sestais
number.7 = septiņi | septītais
number.8 = astoņi | astotais
number.9 = deviņi | devītais
number.10 = desmit | desmitais
number.11 = vienpadsmit | vienpadsmitais
number.12 = divpadsmit | divpadsmitais
number.13 = trīspadsmit | trīspadsmitais
number.14 = četrpadsmit | četrpadsmitais
number.15 = piecpadsmit | piecpadsmitais
number.16 = sešpadsmit | sešpadsmitais
number.17 = septiņpadsmit | septiņpadsmitais
number.18 = astoņpadsmit | astoņpadsmitais
number.19 = deviņpadsmit | deviņpadsmitais
number.20 = divdesmit | divdesmitais
number.21 = divdesmit viens | divdesmit pirmais
number.22 = divdesmit divi | divdesmit otrais
number.23 = divdesmit trīs | divdesmit trešais
number.24 = divdesmit četri | divdesmit ceturtais
number.25 = divdesmit pieci | divdesmit piektais
number.26 = divdesmit seši | divdesmit sestais
number.27 = divdesmit septiņi | divdesmit septītie
number.28 = divdesmit astoņi | divdesmit astotais
number.29 = divdesmit deviņi | divdesmit devītie
number.30 = trīsdesmit | trīsdesmitais
number.31 = trīsdesmit viens | trīsdesmit pirmais
