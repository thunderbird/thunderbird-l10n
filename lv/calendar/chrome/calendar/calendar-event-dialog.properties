repeatDetailsMonth4 = Aprīlis
repeatDetailsMonth5 = Maijs
repeatDetailsMonth6 = Jūnijs
repeatDetailsMonth7 = Jūlijs
repeatDetailsMonth8 = Augusts
repeatDetailsMonth9 = Septembris
repeatDetailsMonth10 = Oktobris
repeatDetailsMonth11 = Novembris
repeatDetailsMonth12 = Decembris
# LOCALIZATION NOTE (repeatDetailsInfiniteAllDay):
# Edit recurrence window -> Recurrence details link on Event/Task dialog window
# %1%$ - A rule string (see above). This is the first line of the link
# %2%$ - event start date (e.g. mm/gg/yyyy)
# e.g. with monthlyDaysOfNth and all day event:
# "Occurs day 3 of every 5 month
#  effective 1/1/2009"
repeatDetailsInfiniteAllDay = Notiek %1$S\nspēkā no %2$S.
# LOCALIZATION NOTE (monthlyLastDay):
# Edit recurrence window -> Recurrence details link on Event/Task dialog window
# A monthly rule with one or more days of the month (monthlyDaysOfNth) and the
# string "the last day" of the month.
# e.g.: "Occurs day 15, 20, 25 and the last day of every 3 months"
monthlyLastDay = pēdējā diena
