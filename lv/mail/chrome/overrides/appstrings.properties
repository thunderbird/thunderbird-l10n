malformedURI2 = Lūdzu, pārbaudiet, vai URL ir pareizs, un mēģiniet vēlreiz.
fileNotFound = Datni %S nevar atrast. Lūdzu, pārbaudiet atrašanās vietu un mēģiniet vēlreiz.
fileAccessDenied = Datne %S nav pieejama.
# %S is replaced by the uri host
httpErrorPage = %S atsūtīja atpakaļ kļūdu.
serverError = Iespējams, vietnei %S radušās īslaicīgas problēmas vai tā ir pārvietota.
dnsNotFound2 = Neizdevās atrast %S. Pārbaudiet nosaukumu un mēģiniet vēlreiz.
basicHttpAuthDisabled = Kāds, iespējams, vilto saturu un mēģina iegūt jūsu lietotājvārdu, paroli vai epasta adresi. Iespējams arī, ka savienojuma iestatījumi ir nepareizi.
unknownProtocolFound = Kāds no šiem protokoliem (%S) nav reģistrēts vai nav atļauts šajā kontekstā.
connectionFailure = Savienojums tika noraidīts, mēģinot sazināties ar %S.
netInterrupt = Savienojums ar %S tika negaidīti pārtraukts. Iespējams, daļa datu tika pārsūtīta.
netTimeout = Mēģinot sazināties ar %S, beidzās operācijai atvēlētais laiks.
redirectLoop = Pārsniegts šī URL pāradresāciju skaita ierobežojums. Pieprasīto saturu nevar ielādēt. Iespējams, iemesls ir liegtās sīkdatnes.
confirmRepostPrompt = Lai parādītu šo saturu, Thunderbird jānosūta dati, tādējādi atkārtojot iepriekš veikto darbību (piemēram, meklēšanu vai pasūtījuma apstiprināšanu).
resendButton.label = Nosūtīt atkārtoti
clientSocketMisconfiguration = Thunderbird nezina, kā sazināties ar serveri.
netReset = Dokumentā nav datu.
notCached = Šis dokuments vairs nav pieejams.
netOffline = Thunderbird pašlaik ir bezsaistes režīmā un nevar izveidot savienojumu ar internetu.
isprinting = Dokumentu nevar mainīt drukāšanas laikā vai drukas priekšskatījumā.
deniedPortAccess = Drošības apsvērumu dēļ piekļuve norādītajam porta numuram ir atspējota.
proxyResolveFailure = Jūsu konfigurēto starpniekserveri nevarēja atrast. Lūdzu, pārbaudiet starpniekservera iestatījumus un mēģiniet vēlreiz.
proxyConnectFailure = Savienojums tika noraidīts, mēģinot izveidot savienojumu ar jūsu konfigurēto starpniekserveri. Lūdzu, pārbaudiet starpniekservera iestatījumus un mēģiniet vēlreiz.
contentEncodingError = Saturu, ko mēģināt skatīt, nevar parādīt, jo tas ir saspiests nederīgā vai neatbalstītā formātā.
unsafeContentType = Saturu, ko mēģināt skatīt, nevar parādīt, jo tas ir datnē, kura atvēršana var nebūt droša. Lūdzu, informējiet servera īpašniekus par šo problēmu.
malwareBlocked = Serveris %S, kā ziņots, ir izmantots uzbrukumiem un ir bloķēts, pamatojoties uz jūsu drošības iestatījumiem.
harmfulBlocked = Saturs vietnē %S ir ziņots kā potenciāli kaitīgs un ir bloķēts, pamatojoties uz jūsu drošības iestatījumiem.
unwantedBlocked = Ir ziņots, ka serveris %S apkalpo nevēlamu programmatūru, un tas ir bloķēts, pamatojoties uz jūsu drošības iestatījumiem.
deceptiveBlocked = Saturs vietnē %S ir ziņots kā maldinošs un ir bloķēts, pamatojoties uz jūsu drošības iestatījumiem.
cspBlocked = Šīs lapas satura drošības politika neļauj to ielādēt šādā veidā.
xfoBlocked = Šīs lapas X-Frame-Options politika neļauj to ielādēt šajā kontekstā.
corruptedContentErrorv2 = Serverī %S radās nelabojama tīkla protokola kļūda.
sslv3Used = Jūsu datu drošību vietnē %S nevarēja garantēt, jo tā izmanto SSLv3 — nedrošu drošības protokolu.
weakCryptoUsed = Vietnes %S īpašnieks nav pareizi konfigurējis serveri. Lai nepieļautu jūsu informācijas nozagšanu, savienojums ar šo serveri netika izveidots.
inadequateSecurityError = Serveris mēģināja vienoties par nepiemērotu drošības līmeni.
blockedByPolicy = Jūsu organizācija ir liegusi piekļuvi šim saturam.
blockedByCORP = Šis saturs netika ielādēts, jo drošības konfigurācija, šķiet, neatbilst iepriekšējam pieprasījumam.
invalidHeaderValue = %S atbildē nosūtīja galveni ar tukšām rakstzīmēm, kuras neatļauj tīmekļa drošības standarti.
networkProtocolError = Thunderbird konstatēja nelabojamu tīkla protokola pārkāpumu.
