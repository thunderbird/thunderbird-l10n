malformedURI2 = Խնդրում ենք ստուգել, որ URL-ը ճիշտ է և կրկին փորձել։
fileNotFound = Անհնար է գտնել %S տվյալը: Խնդրում եմ ստուգեք հասցեն, այնուհետև կրկին փորձեք:
fileAccessDenied = %S ֆայլն անհնար է կարդալ:
# %S is replaced by the uri host
httpErrorPage = %S-ը սխալ է վերադարձրել։
serverError = %S-ը կարող է ժամանակավոր խնդիր ունենալ կամ տեղափոխվել է։
dnsNotFound2 = %S-ը չգտնվեց։ Խնդրում ենք ստուգել անունը և կրկին փորձել։
resendButton.label = Կրկին ուղարկել
clientSocketMisconfiguration = Thunderbird-ը չգիտի, թե ինչպես կապ հաստատել սերվերի հետ։
unknownSocketType = Այս փաստաթուղթը չի կարող ցուցադրվել, եթե դուք չեք տեղադրել Անձնական անվտանգության կառավարիչը (PSM): Ներբեռնեք և տեղադրեք PSM-ը և փորձեք կրկին, կամ կապվեք ձեր համակարգի ադմինիստրատորի հետ:
netReset = Փաստաթուղթը որևէ տվյալ չի պարունակում։
notCached = Փաստաթուղթը այլևս հասանելի չէ։
netOffline = Thunderbird-ը ներկայումս գտնվում է անցանց ռեժիմում և չի կարող միանալ ինտերնետին։
isprinting = Փաստաթղթը տպելու կամ նախադիտելու ժամանակ չի կարող փոփոխվել:
deniedPortAccess = Անվտանգության նկատառումներից ելնելով՝ տրամադրված միացքի համարին մուտքը արգելափակված է։
proxyResolveFailure = Ձեր կողմից կարգավորված պրոքսի սերվերը չի գտնվել: Խնդրում ենք ստուգել ձեր պրոքսիի կարգավորումները և կրկին փորձել:
proxyConnectFailure = Կապը մերժվեց ձեր կողմից կարգավորված պրոքսի սերվերի հետ կապվելու փորձի ժամանակ։ Խնդրում ենք ստուգել ձեր պրոքսիի կարգավորումները և կրկին փորձել։
contentEncodingError = Դուք փորձում եք դիտել բովանդակությունը, քանի որ այն օգտագործում է սեղմման անվավեր կամ չաջակցվող ձև։
unsafeContentType = Էջը, որը դուք փորձում էք դիտել, չի կարող ցուցադրվել քանի որ այն պարունակում է ֆայլի այնպիտի տեսակ որի բացումը կարող է վտանգավոր լինել: Տեղեկացրեք այս պռոբլեմի մասին կայքի ադմինիստրատորների:
malwareBlocked = Ըստ որոշ տեղեկությունների, %S-ի սերվերն օգտագործվել է հարձակումների համար և արգելափակվել է ձեր անվտանգության կարգավորումների հիման վրա։
harmfulBlocked = %S-ի բովանդակությունը նշվել է որպես պոտենցիալ վնասակար և արգելափակվել է ձեր անվտանգության կարգավորումների հիման վրա։
unwantedBlocked = %S-ի սերվերը, ըստ հաղորդագրությունների, սպասարկող անցանկալի ծրագիր է և արգելափակվել է ձեր անվտանգության կարգավորումների հիման վրա։
deceptiveBlocked = %S-ի բովանդակությունը նշվել է որպես խաբուսիկ և արգելափակվել է ձեր անվտանգության կարգավորումների հիման վրա։
cspBlocked = Այս էջն ունի բովանդակության անվտանգության քաղաքականություն, որը կանխում է դրա այս եղանակով բեռնումը։
xfoBlocked = Այս էջն ունի X-Frame-Options քաղաքականություն, որը կանխում է դրա բեռնումը այս համատեքստում։
inadequateSecurityError = Սերվերը փորձեց բանակցել անվտանգության անբավարար մակարդակի շուրջ։
blockedByPolicy = Ձեր կազմակերպությունը արգելափակել է այս բովանդակությանը մուտքը։
blockedByCORP = Այս բովանդակությունը չի բեռնվել, քանի որ, կարծես, անվտանգության կարգավորումը չի համապատասխանում նախորդ հարցմանը։
invalidHeaderValue = %S-ը վերադարձրեց վերնագիր, որը պարունակում էր դատարկ նիշեր, որոնք թույլատրված չեն վեբ անվտանգության ստանդարտներով։
networkProtocolError = Thunderbird-ը ցանցային արձանագրության խախտում է ունեցել, որը չի կարող շտկվել։
