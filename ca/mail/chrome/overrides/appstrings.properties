malformedURI2 = Comproveu que l'URL sigui correcte i torneu-ho a provar.
fileNotFound = No s'ha pogut trobar el fitxer %S. Comproveu la ubicació i torneu-ho a provar.
fileAccessDenied = No es pot llegir el fitxer en %S.
# %S is replaced by the uri host
httpErrorPage = %S ha retornat un error.
serverError = %S pot tenir un problema temporal o pot ser que s'hagi traslladat.
dnsNotFound2 = No s'ha pogut trobar %S. Comproveu el nom i torneu-ho a provar.
basicHttpAuthDisabled = Algú podria estar suplantant el contingut i provar de robar coses com el vostre nom d'usuari, contrasenya o adreça electrònica. També pot ser que tingueu mal configurats els paràmetres de connexió.
unknownProtocolFound = Un dels protocols següents (%S) no està registrat o no es permet en aquest context.
connectionFailure = S'ha rebutjat la connexió en intentar contactar amb %S.
netInterrupt = La connexió a %S ha estat interrompuda de manera inesperada. Potser s'han transferit algunes dades.
netTimeout = S'ha esgotat el temps d'espera en l'operació d'intentar contactar amb %S.
redirectLoop = S'ha excedit el límit de redireccions per a aquest URL. No es pot carregar la pàgina sol·licitada. La causa pot ser que hi hagi galetes blocades.
confirmRepostPrompt = Per mostrar aquest contingut, el Thunderbird ha d'enviar informació que repetirà qualsevol acció (com ara una cerca o la confirmació d'una comanda) que s'hagués fet prèviament.
resendButton.label = Torna a enviar
clientSocketMisconfiguration = El Thunderbird no ha sabut com comunicar-se amb el servidor.
netReset = El document no conté dades.
notCached = Aquest document ja no està disponible.
netOffline = En aquests moments el Thunderbird està en mode fora de línia i no pot connectar-se a internet.
isprinting = El document no es pot canviar durant la impressió o mentre es mostra l'exemple d'impressió.
deniedPortAccess = L'accés al número de port indicat ha estat inhabilitat per motius de seguretat.
proxyResolveFailure = No es pot trobar el servidor intermediari que heu configurat. Comproveu-ne els paràmetres i torneu-ho a provar.
proxyConnectFailure = La connexió s'ha rebutjat en intentar contactar amb el servidor intermediari que heu configurat. Comproveu-ne els paràmetres i torneu-ho a provar.
contentEncodingError = No pot mostrar-se el contingut que esteu intentant visualitzar perquè utilitza una forma de compressió no vàlida o incompatible.
unsafeContentType = No pot mostrar-se el contingut que esteu provant de visualitzar perquè es troba en un tipus de fitxer que podria no ser segur obrir-lo. Poseu-vos en contacte amb els propietaris del lloc web per informar-los del problema.
malwareBlocked = S'ha informat que el servidor de %S s'ha utilitzat per a fer atacs i s'ha blocat d'acord amb els vostres paràmetres de seguretat.
