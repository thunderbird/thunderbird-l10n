## Signature Information strings
SINoneLabel = پیام امضای دیجیتال ندارد
SINone = این پیام امضای دیجیتال فرستنده را ندارد. نبودن امضای دیجیتال یعنی ممکن است پیام را کسی فرستاده باشد که خود را صاحب این نشانی رایانامه جا زده است. همچنین ممکن است پیام در حین انتقال در شبکه تغییر کرده باشد. با این حال، احتمال وقوع هیچ‌یک از این دو زیاد نیست.
SIValidLabel = پیام امضا شده است
SIValid = این پیام امضای دیجیتال معتبری دارد. پیام از زمان ارسال تغییر نکرده است.
SIInvalidLabel = امضای دیجیتال معتبر نیست
SIInvalidHeader = این پیام امضای دیجیتال دارد، اما امضا نامعتبر است.
SIContentAltered = امضا با محتوای پیام به‌درستی مطابقت ندارد. به نظر می‌رسد پیام پس از امضای فرستنده تغییر کرده است. تا زمانی که محتوای پیام را با فرستنده بررسی نکرده‌اید، به اعتبار آن اعتماد نکنید.
SIExpired = به نظر می‌رسد گواهی استفاده‌شده برای امضای پیام منقضی شده است. مطمئن شوید ساعت رایانهٔ شما درست تنظیم شده باشد.
SIRevoked = گواهی استفاده‌شده برای امضای پیام باطل شده است. تا زمانی که محتوای پیام را با فرستنده بررسی نکرده‌اید، به اعتبار آن اعتماد نکنید.
SINotYetValid = به نظر می‌رسد گواهی استفاده‌شده برای امضای پیام هنوز معتبر نیست. مطمئن شوید ساعت رایانهٔ شما درست تنظیم شده باشد.
SIUnknownCA = گواهی استفاده‌شده برای امضای پیام توسط مرجع صدور گواهی ناشناخته‌ای صادر شده است.
SIUntrustedCA = گواهی استفاده‌شده برای امضای پیام توسط مرجع صدور گواهی‌ای صادر شده که برای صدور این نوع گواهی به آن اعتماد ندارید.
SIExpiredCA = گواهی استفاده‌شده برای امضای پیام توسط مرجع صدور گواهی‌ای صادر شده که گواهی خودش منقضی شده است. مطمئن شوید ساعت رایانهٔ شما درست تنظیم شده باشد.
SIRevokedCA = گواهی استفاده‌شده برای امضای پیام توسط مرجع صدور گواهی‌ای صادر شده که گواهی خودش باطل شده است. تا زمانی که محتوای پیام را با فرستنده بررسی نکرده‌اید، به اعتبار آن اعتماد نکنید.
SINotYetValidCA = گواهی استفاده‌شده برای امضای پیام توسط مرجع صدور گواهی‌ای صادر شده که گواهی خودش هنوز معتبر نیست. مطمئن شوید ساعت رایانهٔ شما درست تنظیم شده باشد.
SIInvalidCipher = پیام با قدرت رمزگذاری‌ای امضا شده که این نگارش از نرم‌افزار شما از آن پشتیبانی نمی‌کند.
SIClueless = این امضای دیجیتال مشکلات ناشناخته‌ای دارد. تا زمانی که محتوای پیام را با فرستنده بررسی نکرده‌اید، به اعتبار آن اعتماد نکنید.
SIPartiallyValidLabel = پیام امضا شده است
SIPartiallyValidHeader = با اینکه امضای دیجیتال معتبر است، مشخص نیست فرستنده و امضاکننده یک نفر باشند.
SIHeaderMismatch = نشانی رایانامهٔ درج‌شده در گواهی امضاکننده با نشانی رایانامه‌ای که برای ارسال این پیام استفاده شده متفاوت است. برای اینکه بدانید چه کسی پیام را امضا کرده، جزئیات گواهی امضا را ببینید.
SICertWithoutAddress = گواهی استفاده‌شده برای امضای پیام نشانی رایانامه ندارد. برای اینکه بدانید چه کسی پیام را امضا کرده، جزئیات گواهی امضا را ببینید.
## Encryption Information strings
EINoneLabel2 = پیام رمزگذاری نشده است
EINone = این پیام پیش از ارسال رمزگذاری نشده است. اطلاعاتی که بدون رمزگذاری در اینترنت ارسال می‌شوند ممکن است در حین انتقال توسط دیگران دیده شوند.
EIValidLabel = پیام رمزگذاری شده است
EIValid = این پیام پیش از ارسال برای شما رمزگذاری شده است. رمزگذاری دیدن اطلاعات را هنگام انتقال در شبکه برای دیگران بسیار دشوار می‌کند.
EIInvalidLabel = پیام قابل رمزگشایی نیست
EIInvalidHeader = این پیام پیش از ارسال برای شما رمزگذاری شده، اما رمزگشایی آن ممکن نیست.
EIContentAltered = به نظر می‌رسد محتوای پیام در حین انتقال تغییر کرده است.
EIClueless = این پیام رمزگذاری‌شده مشکلات ناشناخته‌ای دارد.
