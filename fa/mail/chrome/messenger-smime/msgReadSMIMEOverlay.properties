ImapOnDemand = پیام نمایش‌داده‌شده به‌طور دیجیتال امضا شده است، اما هنوز همهٔ پیوست‌های آن بارگیری نشده‌اند. بنابراین امضا را نمی‌توان اعتبارسنجی کرد. برای بارگیری کامل پیام و اعتبارسنجی امضا روی «تأیید» کلیک کنید.
# NOTE To translator, anything between %..% and <..> should not be translated.
# the former will be replaced by java script, and the latter is HTML formatting.
CantDecryptTitle = %brand% نمی‌تواند این پیام را رمزگشایی کند
CantDecryptBody = فرستنده این پیام را با یکی از گواهی‌های دیجیتال شما رمزگذاری کرده است، اما %brand% نتوانست این گواهی و کلید خصوصی متناظر آن را پیدا کند. <br> راه‌حل‌های ممکن: <br><ul><li>اگر کارت هوشمند دارید، لطفاً هم‌اکنون آن را وارد کنید. <li>اگر از رایانهٔ جدید یا نمایهٔ جدید %brand% استفاده می‌کنید، باید گواهی و کلید خصوصی خود را از نگارش پشتیبان بازیابی کنید. پسوند پرونده‌های پشتیبان گواهی معمولاً «.p12» است.</ul>
