# LOCALIZATION NOTE(pop3ErrorDialogTitle): Do not translate the word "%S"
# below. Place the word %S where the account name should appear.
pop3ErrorDialogTitle = خطا در حساب %S
# LOCALIZATION NOTE (pop3EnterPasswordPromptTitleWithUsername): Do not translate the
# word %1$S. Place the word %1$S where the user name should appear.
pop3EnterPasswordPromptTitleWithUsername = گذرواژهٔ %1$S را وارد کنید
# LOCALIZATION NOTE(pop3EnterPasswordPrompt): Do not translate the words "%1$S"
# and "%2$S" below. Place the word %1$S where the user name should appear, and
# %2$S where the host name should appear.
pop3EnterPasswordPrompt = گذرواژهٔ %1$S را در %2$S وارد کنید:
# LOCALIZATION NOTE(pop3PreviouslyEnteredPasswordIsInvalidPrompt): Do not
# translate the words "%1$S" and "%2$S" below. Place the word %1$S where the
# user name should appear, and %2$S where the host name should appear.
pop3PreviouslyEnteredPasswordIsInvalidPrompt = لطفاً گذرواژهٔ جدیدی برای کاربر %1$S در %2$S وارد کنید:
# Status - Downloading message n of m
# LOCALIZATION NOTE (receivingMessages): Do not translate %1$S or %2$S in the following lines.
# Place the word %1$S where the number of messages downloaded so far should appear.
# Place the word %2$S where the total number of messages to receive should appear;
receivingMessages = در حال بارگیری پیام %1$S از %2$S…
# Status - connecting to host
hostContact = با میزبان ارتباط برقرار شد، در حال ارسال اطلاعات ورود…
# Status - no messages to download
noNewMessages = پیام جدیدی نیست.
# Status - messages received after the download
# LOCALIZATION NOTE : Do not translate %1$S or %2$S in the following line.
# %1$S will receive the number of messages received
# %2$S will receive the total number of messages
receivedMsgs = %1$S از %2$S پیام دریافت شد
# Status - parsing folder
# LOCALIZATION NOTE (buildingSummary): Do not translate %S in the following line.
# Place the word %S where the name of the mailbox should appear
buildingSummary = در حال ساختن پروندهٔ خلاصه برای %S…
# Status - parsing folder
localStatusDocumentDone = انجام شد
# Status - pop3 server error
# LOCALIZATION NOTE (pop3ServerError): Do not translate POP3 in the following line.
pop3ServerError = خطایی در کارساز رایانامهٔ POP3 رخ داد.
# Status - pop3 user name failed
pop3UsernameFailure = ارسال نام کاربری موفق نبود.
# Status - password failed
# LOCALIZATION NOTE (pop3PasswordFailed): Do not translate "%1$S" below.
# Place the word %1$S where the user name should appear.
pop3PasswordFailed = ارسال گذرواژه برای کاربر %1$S موفق نبود.
# Status - write error occurred
pop3MessageWriteError = نوشتن رایانامه در صندوق پستی ممکن نیست. مطمئن شوید که سامانهٔ پرونده به شما اجازهٔ نوشتن می‌دهد و فضای دیسک کافی برای رونوشت صندوق پستی دارید.
# Status - retr failure from the server
pop3RetrFailure = فرمان RETR موفق نبود. خطا در دریافت پیام.
# Status - password undefined
pop3PasswordUndefined = خطا در دریافت گذرواژهٔ رایانامه.
# Status - username undefined
pop3UsernameUndefined = برای این کارساز نام کاربری وارد نکرده‌اید.  لطفاً آن را در منوی راه‌اندازی حساب وارد کنید و دوباره تلاش کنید.
# Status - list failure
pop3ListFailure = فرمان LIST موفق نبود. خطا در دریافت شناسه و اندازهٔ پیام.
# Status - delete error
pop3DeleFailure = فرمان DELE موفق نبود. خطا در علامت‌گذاری پیام به‌عنوان حذف‌شده.
# Status - stat failed
pop3StatFail = فرمان STAT موفق نبود. خطا در دریافت تعداد و اندازهٔ پیام‌ها.
# LOCALIZATION NOTE (pop3ServerSaid): Do not remove the leading space during translation.
pop3ServerSaid = پاسخ کارساز رایانامهٔ %S:
# LOCALIZATION NOTE (pop3TempServerError): %S is where the POP3 server name will appear.
pop3TempServerError = خطای موقت از %S هنگام دریافت پیام‌های جدید. این عملیات در بررسی بعدی پیام‌های جدید دوباره انجام می‌شود.
copyingMessagesStatus = در حال رونوشت %S از %S پیام در %S
movingMessagesStatus = در حال انتقال %S از %S پیام به %S
# Status - pop3 server or folder busy
# LOCALIZATION NOTE (pop3ServerBusy): Do not translate the word "%S" below.
# Place %S where the account name should appear.
pop3ServerBusy = حساب %S در حال پردازش است. لطفاً برای دریافت پیام‌ها تا پایان پردازش صبر کنید.
pop3TmpDownloadError = هنگام بارگیری پیام زیر خطایی رخ داد:   \nاز: %S\n   موضوع: %S\n ممکن است این پیام حاوی ویروس باشد یا فضای دیسک کافی نباشد. از این پیام صرف‌نظر شود؟
# Status - the server doesn't support UIDL…
# LOCALIZATION NOTE(pop3ServerDoesNotSupportUidlEtc): The following sentence should be translated in this way:
# Do not translate "POP3"
# Do not translate "%S". Place %S in your translation where the name of the server should appear.
# Do not translate "UIDL"
pop3ServerDoesNotSupportUidlEtc = کارساز رایانامهٔ POP3 (%S) از UIDL یا XTND XLST پشتیبانی نمی‌کند که برای اجرای گزینه‌های «نگه‌داشتن روی کارساز»، «حداکثر اندازهٔ پیام» یا «فقط دریافت سرایندها» لازم است. برای بارگیری رایانامه‌هایتان، این گزینه‌ها را در تنظیمات کارساز رایانامهٔ خود در پنجرهٔ تنظیمات حساب خاموش کنید.
# Status - the server doesn't support the top command
# LOCALIZATION NOTE(pop3ServerDoesNotSupportTopCommand): The following sentence should be translated in this way:
# Do not translate "POP3"
# Do not translate "%S". Place %S in your translation where the name of the server should appear.
# Do not translate "TOP"
pop3ServerDoesNotSupportTopCommand = کارساز رایانامهٔ POP3 (%S) از فرمان TOP پشتیبانی نمی‌کند. بدون پشتیبانی کارساز از این فرمان، نمی‌توانیم ترجیح «حداکثر اندازهٔ پیام» یا «فقط دریافت سرایندها» را اجرا کنیم. این گزینه ازکار افتاد و پیام‌ها بدون توجه به اندازه‌شان بارگیری می‌شوند.
nsErrorCouldNotConnectViaTls = برقراری اتصال TLS با کارساز POP3 ممکن نیست. ممکن است کارساز ازکار افتاده یا نادرست پیکربندی شده باشد. لطفاً پیکربندی درست را در تنظیمات کارساز رایانامهٔ خود در پنجرهٔ تنظیمات حساب بررسی کنید و دوباره تلاش کنید.
# LOCALIZATION NOTE (pop3MoveFolderToTrash): Do not translate the word %S below.
# "%S" is the the name of the folder.
pop3MoveFolderToTrash = مطمئنید می‌خواهید پوشهٔ «%S» را حذف کنید؟
pop3DeleteFolderDialogTitle = حذف پوشه
pop3DeleteFolderButtonLabel = &حذف پوشه
pop3AuthInternalError = خطای وضعیت داخلی هنگام احراز هویت با کارساز POP3. این یک خطای داخلی و غیرمنتظره در برنامه است؛ لطفاً آن را به‌عنوان اشکال گزارش کنید.
pop3AuthChangeEncryptToPlainNoSSL = به نظر می‌رسد این کارساز POP3 از گذرواژه‌های رمزگذاری‌شده پشتیبانی نمی‌کند. اگر تازه حساب را راه‌اندازی کرده‌اید، در «تنظیمات حساب | تنظیمات کارساز»، «روش احراز هویت» را به «گذرواژه، ارسال ناامن» تغییر دهید. اگر قبلاً کار می‌کرد و اکنون ناگهان ناموفق است، این یک سناریوی رایج برای سرقت گذرواژهٔ شماست.
pop3AuthChangeEncryptToPlainSSL = به نظر می‌رسد این کارساز POP3 از گذرواژه‌های رمزگذاری‌شده پشتیبانی نمی‌کند. اگر تازه این حساب را راه‌اندازی کرده‌اید، در «تنظیمات حساب | تنظیمات کارساز»، «روش احراز هویت» را به «گذرواژهٔ عادی» تغییر دهید. اگر قبلاً کار می‌کرد و اکنون ناگهان ناموفق است، لطفاً با مدیر یا ارائه‌دهندهٔ رایانامهٔ خود تماس بگیرید.
pop3AuthChangePlainToEncrypt = این کارساز POP3 گذرواژه‌های متن ساده را نمی‌پذیرد. لطفاً در «تنظیمات حساب | تنظیمات کارساز»، «روش احراز هویت» را به «گذرواژهٔ رمزگذاری‌شده» تغییر دهید.
# Authentication server caps and pref don't match
pop3AuthMechNotSupported = کارساز از روش احراز هویت انتخاب‌شده پشتیبانی نمی‌کند. لطفاً «روش احراز هویت» را در «تنظیمات حساب | تنظیمات کارساز» تغییر دهید.
# Status - Could not log in to GSSAPI, and it was the only method
pop3GssapiFailure = کارساز POP بلیت Kerberos/GSSAPI را نپذیرفت. لطفاً بررسی کنید که به قلمرو Kerberos/GSSAPI وارد شده باشید.
