# LOCALIZATION NOTE: confirmDeferAccountWarning: do not localize "\n\n", it means a new empty line in the string.
confirmDeferAccountWarning = اگر رایانامه‌های جدید این حساب را در صندوق ورودی حساب دیگری نگه دارید، دیگر به رایانامه‌هایی که قبلاً برای این حساب بارگیری شده‌اند دسترسی نخواهید داشت. اگر در این حساب رایانامه دارید، لطفاً ابتدا آن‌ها را در حساب دیگری رونوشت کنید.\n\nاگر پالایه‌هایی دارید که رایانامه‌ها را به این حساب منتقل می‌کنند، باید آن‌ها را ازکار بیندازید یا پوشهٔ مقصدشان را تغییر دهید. اگر حسابی پوشه‌های ویژه‌اش (ارسال‌شده‌ها، پیش‌نویس‌ها، قالب‌ها، بایگانی‌ها، هرزنامه) را در این حساب دارد، باید آن‌ها را به حساب دیگری منتقل کنید.\n\nهنوز می‌خواهید رایانامه‌های این حساب را در حساب دیگری نگه دارید؟
confirmDeferAccountTitle = واگذاری حساب؟
directoryAlreadyUsedByOtherAccount = شاخهٔ تعیین‌شده در تنظیم «شاخهٔ محلی» قبلاً توسط حساب «%S» استفاده شده است. لطفاً شاخهٔ دیگری انتخاب کنید.
directoryParentUsedByOtherAccount = یکی از شاخه‌های والد شاخهٔ تعیین‌شده در تنظیم «شاخهٔ محلی» قبلاً توسط حساب «%S» استفاده شده است. لطفاً شاخهٔ دیگری انتخاب کنید.
directoryChildUsedByOtherAccount = یکی از زیرپوشه‌های پوشهٔ تعیین‌شده در تنظیم «پوشهٔ محلی» قبلاً توسط حساب «%S» استفاده شده است. لطفاً پوشهٔ دیگری انتخاب کنید.
