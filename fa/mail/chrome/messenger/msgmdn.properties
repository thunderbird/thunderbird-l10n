## Msg Mdn Report strings
MsgMdnDisplayed = توجه: این رسید دریافت فقط تأیید می‌کند که پیام روی رایانهٔ گیرنده نمایش داده شده است. تضمینی نیست که گیرنده محتوای پیام را خوانده یا فهمیده باشد.
MsgMdnDispatched = پیام بدون نمایش به گیرنده چاپ، دورنگاری یا بازارسال شده است. تضمینی نیست که گیرنده بعداً پیام را بخواند.
MsgMdnProcessed = پیام توسط برنامهٔ رایانامهٔ گیرنده بدون نمایش پردازش شد. تضمینی نیست که پیام بعداً خوانده شود.
MsgMdnDeleted = پیام حذف شده است. ممکن است گیرنده آن را دیده یا ندیده باشد. ممکن است بعداً آن را بازیابی کند و بخواند.
MsgMdnDenied = گیرندهٔ پیام نمی‌خواهد رسید دریافت برایتان بفرستد.
MsgMdnFailed = خطایی رخ داد. رسید دریافت مناسبی ساخته یا برایتان ارسال نشد.
# LOCALIZATION NOTE : Do not translate the word "%S" below.
MsgMdnMsgSentTo = این رسید دریافت برای رایانامه‌ای است که به %S فرستادید.
MdnDisplayedReceipt = رسید دریافت (نمایش‌داده‌شده)
MdnDispatchedReceipt = رسید دریافت (ارسال‌شده)
MdnProcessedReceipt = رسید دریافت (پردازش‌شده)
MdnDeletedReceipt = رسید دریافت (حذف‌شده)
MdnDeniedReceipt = رسید دریافت (ردشده)
MdnFailedReceipt = رسید دریافت (ناموفق)
