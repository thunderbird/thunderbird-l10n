# LOCALIZATION NOTE (imapAuthChangeEncryptToPlainSSL): %S is the server hostname
imapAuthChangeEncryptToPlainSSL = به نظر می‌رسد کارساز IMAP %S از گذرواژه‌های رمزگذاری‌شده پشتیبانی نمی‌کند. اگر تازه این حساب را راه‌اندازی کرده‌اید، در «تنظیمات حساب | تنظیمات کارساز»، «روش احراز هویت» را به «گذرواژهٔ عادی» تغییر دهید. اگر قبلاً کار می‌کرد و اکنون ناگهان ناموفق است، لطفاً با مدیر یا ارائه‌دهندهٔ رایانامهٔ خود تماس بگیرید.
# LOCALIZATION NOTE (imapAuthChangePlainToEncrypt): %S is the server hostname
imapAuthChangePlainToEncrypt = کارساز IMAP %S گذرواژه‌های متن ساده را نمی‌پذیرد. لطفاً در «تنظیمات حساب | تنظیمات کارساز»، «روش احراز هویت» را به «گذرواژهٔ رمزگذاری‌شده» تغییر دهید.
# LOCALIZATION NOTE (imapAuthChangeEncryptToPlainNoSSL): %S is the server hostname
imapAuthChangeEncryptToPlainNoSSL = به نظر می‌رسد کارساز IMAP %S از گذرواژه‌های رمزگذاری‌شده پشتیبانی نمی‌کند. اگر تازه حساب را راه‌اندازی کرده‌اید، در «تنظیمات حساب | تنظیمات کارساز»، «روش احراز هویت» را به «گذرواژه، ارسال ناامن» تغییر دهید. اگر قبلاً کار می‌کرد و اکنون ناگهان ناموفق است، این یک سناریوی رایج برای سرقت گذرواژهٔ شماست.
