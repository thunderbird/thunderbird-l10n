MissingRecipientEncryptionCert = برای این پیام رمزگذاری را مشخص کرده‌اید، اما برنامه نتوانست گواهی رمزگذاری‌ای برای %S پیدا کند.
ErrorEncryptMail = رمزگذاری پیام ممکن نیست. لطفاً بررسی کنید که برای هر گیرنده یک گواهی رایانامهٔ معتبر داشته باشید. همچنین بررسی کنید که گواهی‌های تعیین‌شده در تنظیمات حساب رایانامه و گروه‌های خبری برای این حساب رایانامه معتبر و برای رایانامه مورد اعتماد باشند.
ErrorCanNotSignMail = امضای پیام ممکن نیست. لطفاً بررسی کنید که گواهی‌های تعیین‌شده در تنظیمات حساب رایانامه و گروه‌های خبری برای این حساب رایانامه معتبر و برای رایانامه مورد اعتماد باشند.
## Strings used for in the prefs.
NoSigningCert = مدیر گواهی‌ها نمی‌تواند گواهی معتبری برای امضای دیجیتال پیام‌های شما پیدا کند.
NoSigningCertForThisAddress = مدیر گواهی‌ها نمی‌تواند گواهی معتبری برای امضای دیجیتال پیام‌های شما با نشانی <%S> پیدا کند.
NoEncryptionCert = مدیر گواهی‌ها نمی‌تواند گواهی معتبری پیدا کند که دیگران بتوانند با آن برای شما رایانامهٔ رمزگذاری‌شده بفرستند.
NoEncryptionCertForThisAddress = مدیر گواهی‌ها نمی‌تواند گواهی معتبری پیدا کند که دیگران بتوانند با آن به نشانی <%S> برای شما رایانامهٔ رمزگذاری‌شده بفرستند.
encryption_needCertWantSame = باید گواهی‌ای هم مشخص کنید که دیگران هنگام ارسال پیام‌های رمزگذاری‌شده برای شما از آن استفاده کنند. می‌خواهید از همین گواهی برای رمزگذاری و رمزگشایی پیام‌هایی که برایتان فرستاده می‌شود استفاده کنید؟
encryption_wantSame = می‌خواهید از همین گواهی برای رمزگذاری و رمزگشایی پیام‌هایی که برایتان فرستاده می‌شود استفاده کنید؟
encryption_needCertWantToSelect = باید گواهی‌ای هم مشخص کنید که دیگران هنگام ارسال پیام‌های رمزگذاری‌شده برای شما از آن استفاده کنند. می‌خواهید هم‌اکنون یک گواهی رمزگذاری پیکربندی کنید؟
signing_needCertWantSame = باید گواهی‌ای هم برای امضای دیجیتال پیام‌هایتان مشخص کنید. می‌خواهید از همین گواهی برای امضای دیجیتال پیام‌هایتان استفاده کنید؟
signing_wantSame = می‌خواهید از همین گواهی برای امضای دیجیتال پیام‌هایتان استفاده کنید؟
signing_needCertWantToSelect = باید گواهی‌ای هم برای امضای دیجیتال پیام‌هایتان مشخص کنید. می‌خواهید هم‌اکنون یک گواهی برای امضای دیجیتال پیام‌ها پیکربندی کنید؟
## Strings used by nsMsgComposeSecure
mime_smimeEncryptedContentDesc = پیام رمزگذاری‌شدهٔ S/MIME
mime_smimeSignatureContentDesc = امضای رمزنگاشتی S/MIME
## Strings used by the cert picker.
CertInfoIssuedFor = صادرشده برای:
CertInfoIssuedBy = صادرکننده:
CertInfoValid = معتبر
CertInfoFrom = از
CertInfoTo = تا
CertInfoPurposes = کاربردها
CertInfoEmail = رایانامه
CertInfoStoredIn = ذخیره‌شده در:
NicknameExpired = (منقضی‌شده)
NicknameNotYetValid = (هنوز معتبر نیست)
## S/MIME error strings.
## Note to localization: %S is a placeholder
SenderSigningCertInvalid = این پیام را نمی‌توان به‌طور دیجیتال امضا کرد، چون گواهی امضای انتخاب‌شده در تنظیمات رمزگذاری سرتاسری شما برای این کار معتبر نیست. (%S)
SenderEncryptionCertInvalid = این پیام را نمی‌توان رمزگذاری کرد، چون گواهی رمزگذاری انتخاب‌شده در تنظیمات رمزگذاری سرتاسری شما برای این کار معتبر نیست. (%S)
