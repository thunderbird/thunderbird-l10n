# LOCALIZATION NOTE (gloda.message.attr.account.*): Stores the account in which
#  a message's folder is located.
gloda.message.attr.account.facetNameLabel = حساب
gloda.message.attr.account.includeLabel = ذخیره‌شده در هر یک از:
gloda.message.attr.account.excludeLabel = ذخیره‌نشده در:
gloda.message.attr.account.remainderLabel = حساب‌های دیگر:
gloda.message.attr.account.mustMatchLabel = باید در #1 باشد
gloda.message.attr.account.cantMatchLabel = نمی‌تواند در #1 باشد
# LOCALIZATION NOTE (gloda.message.attr.folder.*): Stores the message folder in
#  which the message is stored.
gloda.message.attr.folder.facetNameLabel = پوشه
gloda.message.attr.folder.includeLabel = ذخیره‌شده در هر یک از:
gloda.message.attr.folder.excludeLabel = ذخیره‌نشده در:
gloda.message.attr.folder.remainderLabel = پوشه‌های دیگر:
gloda.message.attr.folder.mustMatchLabel = باید در #1 ذخیره شده باشد
gloda.message.attr.folder.cantMatchLabel = نمی‌تواند در #1 ذخیره شده باشد
# LOCALIZATION NOTE (gloda.message.attr.fromMe.*): Stores everyone involved
#  with the message.  This means from/to/cc/bcc.
gloda.message.attr.fromMe.facetNameLabel = از طرف من
# LOCALIZATION NOTE (gloda.message.attr.toMe.*): Stores everyone involved
#  with the message.  This means from/to/cc/bcc.
gloda.message.attr.toMe.facetNameLabel = به من
# LOCALIZATION NOTE (gloda.message.attr.involves.*): Stores everyone involved
#  with the message.  This means from/to/cc/bcc.
gloda.message.attr.involves.facetNameLabel = افراد
gloda.message.attr.involves.includeLabel = با حضور هر یک از:
gloda.message.attr.involves.excludeLabel = بدون حضور:
gloda.message.attr.involves.remainderLabel = شرکت‌کنندگان دیگر:
gloda.message.attr.involves.mustMatchLabel = باید شامل #1 باشد
gloda.message.attr.involves.cantMatchLabel = نمی‌تواند شامل #1 باشد
# LOCALIZATION NOTE (gloda.message.attr.date.*): Stores the date of the message.
#  Thunderbird normally stores the date the message claims it was composed
#  according to the "Date" header.  This is not the same as when the message
#  was sent or when it was eventually received by the user.  In the future we
#  may change this to be one of the other dates, but not anytime soon.
gloda.message.attr.date.facetNameLabel = تاریخ
# LOCALIZATION NOTE (gloda.message.attr.attachmentTypes.*): Stores the list of
#  MIME types (ex: image/png, text/plain) of real attachments (not just part of
#  the message content but explicitly named attachments) on the message.
#  Although we hope to be able to provide localized human-readable explanations
#  of the MIME type (ex: "PowerPoint document"), I don't know if that is going
#  to happen.
gloda.message.attr.attachmentTypes.facetNameLabel = پیوست‌ها
# LOCALIZATION NOTE (gloda.message.attr.mailing-list.*): Stores the mailing
#  lists detected in the message.  This will normally be the email address of
#  the mailing list and only be detected in messages received from the mailing
#  list.  Extensions may contribute additional detected mailing-list-like
#  things.
gloda.message.attr.mailing-list.facetNameLabel = فهرست پستی
gloda.message.attr.mailing-list.noneLabel = هیچ
gloda.message.attr.mailing-list.includeLabel = دریافت‌شده در هر یک از:
gloda.message.attr.mailing-list.excludeLabel = دریافت‌نشده در هیچ‌یک از:
gloda.message.attr.mailing-list.remainderLabel = فهرست‌های پستی دیگر:
gloda.message.attr.mailing-list.mustMatchLabel = باید در #1 باشد
gloda.message.attr.mailing-list.cantMatchLabel = نمی‌تواند در #1 باشد
gloda.message.attr.mailing-list.mustMatchSomeLabel = باید در فهرست پستی باشد
gloda.message.attr.mailing-list.mustMatchNoneLabel = نمی‌تواند در فهرست پستی باشد
# LOCALIZATION NOTE (gloda.message.attr.tag.*): Stores the tags applied to the
#  message.  Notably, gmail's labels are not currently exposed via IMAP and we
#  do not do anything clever with gmail, so this is independent of gmail labels
#  This may change in the future, but it's a safe bet it's not happening on
#  Thunderbird's side prior to 3.0.
gloda.message.attr.tag.facetNameLabel = برچسب‌ها
gloda.message.attr.tag.noneLabel = هیچ
gloda.message.attr.tag.includeLabel = دارای هر یک از برچسب‌های:
gloda.message.attr.tag.excludeLabel = بدون برچسب:
gloda.message.attr.tag.remainderLabel = برچسب‌های دیگر:
gloda.message.attr.tag.mustMatchLabel = باید برچسب #1 داشته باشد
gloda.message.attr.tag.cantMatchLabel = نمی‌تواند برچسب #1 داشته باشد
gloda.message.attr.tag.mustMatchSomeLabel = باید برچسب داشته باشد
gloda.message.attr.tag.mustMatchNoneLabel = نمی‌تواند برچسب داشته باشد
# LOCALIZATION NOTE (gloda.message.attr.star.*): Stores whether the message is
#  starred or not, as indicated by a pretty star icon.  In the past, the icon
#  used to be a flag.  The IMAP terminology continues to be "flagged".
gloda.message.attr.star.facetNameLabel = ستاره‌دار
# LOCALIZATION NOTE (gloda.message.attr.read.*): Stores whether the user has
#  read the message or not.
gloda.message.attr.read.facetNameLabel = خوانده‌شده
# LOCALIZATION NOTE (gloda.message.attr.repliedTo.*): Stores whether we believe
#  the user has ever replied to the message.  We normally show a little icon in
#  the thread pane when this is the case.
gloda.message.attr.repliedTo.facetNameLabel = پاسخ‌داده‌شده
# LOCALIZATION NOTE (gloda.message.attr.forwarded.*): Stores whether we believe
#  the user has ever forwarded the message.  We normally show a little icon in
#  the thread pane when this is the case.
gloda.message.attr.forwarded.facetNameLabel = بازارسال‌شده
# LOCALIZATION NOTE (gloda.mimetype.category.*.label): Map categories of MIME
#  types defined in MimeTypeCategories to labels.
# LOCALIZATION NOTE (gloda.mimetype.category.archives.label): Archive is
#  referring to things like zip files, tar files, tar.gz files, etc.
gloda.mimetype.category.archives.label = بایگانی‌ها
gloda.mimetype.category.documents.label = اسناد
gloda.mimetype.category.images.label = تصاویر
# LOCALIZATION NOTE (gloda.mimetype.category.media.label): Media is meant to
#  encompass both audio and video.  This is because video and audio streams are
#  frequently stored in the same type of container and we cannot rely on the
#  sending email client to have been clever enough to figure out what was
#  really in the file.  So we group them together.
gloda.mimetype.category.media.label = رسانه (صدا، ویدیو)
gloda.mimetype.category.pdf.label = پرونده‌های PDF
# LOCALIZATION NOTE (gloda.mimetype.category.other.label): Other is the category
#  for MIME types that we don't really know what it is.
gloda.mimetype.category.other.label = سایر
