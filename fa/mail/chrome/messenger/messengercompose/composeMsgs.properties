# The following are used by the compose back end
unableToSaveTemplate = ذخیرهٔ پیام شما به‌عنوان قالب ممکن نیست.
unableToSaveDraft = ذخیرهٔ پیام شما به‌عنوان پیش‌نویس ممکن نیست.
noRecipients = هیچ گیرنده‌ای مشخص نشده است. لطفاً در بخش نشانی‌دهی یک گیرنده یا گروه خبری وارد کنید.
## LOCALIZATION NOTE (errorSendingFromCommand): argument %s is the Outgoing server (SMTP) response
errorSendingFromCommand = هنگام ارسال رایانامه خطایی رخ داد. پاسخ کارساز رایانامه: %s. لطفاً بررسی کنید که نشانی رایانامهٔ شما در تنظیمات حساب درست باشد و دوباره تلاش کنید.
## LOCALIZATION NOTE (errorSendingDataCommand): argument %s is the Outgoing server (SMTP) response
errorSendingDataCommand = هنگام ارسال رایانامه، خطای کارساز خروجی (SMTP) رخ داد. پاسخ کارساز:  %s.
## LOCALIZATION NOTE (errorSendingMessage): argument %s is the Outgoing server (SMTP) response
errorSendingMessage = هنگام ارسال رایانامه خطایی رخ داد. پاسخ کارساز رایانامه:  %s. لطفاً پیام را بررسی کنید و دوباره تلاش کنید.
postFailed = پیام فرستاده نشد، چون اتصال به کارساز خبر ناموفق بود. ممکن است کارساز در دسترس نباشد یا اتصال‌ها را رد کند. لطفاً درستی تنظیمات کارساز خبر خود را بررسی کنید و دوباره تلاش کنید.
errorQueuedDeliveryFailed = هنگام تحویل پیام‌های ارسال‌نشده خطایی رخ داد.
sendFailed = ارسال پیام ناموفق بود.
## LOCALIZATION NOTE (smtpSecurityIssue): argument %S is the Outgoing server (SMTP) response
smtpSecurityIssue = پیکربندی مربوط به %S باید اصلاح شود.
## LOCALIZATION NOTE (smtpServerError): argument %s is the Outgoing server (SMTP) response
smtpServerError = هنگام ارسال رایانامه خطایی رخ داد: خطای کارساز خروجی (SMTP). پاسخ کارساز:  %s.
unableToSendLater = متأسفیم، ذخیرهٔ پیام شما برای ارسال بعدی ممکن نشد.
dontShowAlert = این فقط یک متغیر است.  شما هرگز نباید این رشته را ببینید.
failedCopyOperation = پیام با موفقیت ارسال شد، اما رونوشت آن در پوشهٔ ارسال‌شده‌ها قرار نگرفت.
msgCancelling = در حال لغو…
sendFailedButNntpOk = پیام شما در گروه خبری فرستاده شد، اما برای گیرندهٔ دیگر ارسال نشد.
followupToSenderMessage = نویسندهٔ این پیام درخواست کرده است که پاسخ‌ها فقط برای خودش فرستاده شود. اگر می‌خواهید به گروه خبری هم پاسخ دهید، یک ردیف جدید به بخش نشانی‌دهی اضافه کنید، از فهرست گیرندگان «گروه خبری» را انتخاب کنید و نام گروه خبری را وارد کنید.
## LOCALIZATION NOTE (errorAttachingFile): argument %S is the file name/URI of the object to be attached
errorAttachingFile = هنگام پیوست کردن %S خطایی رخ داد. لطفاً بررسی کنید که به پرونده دسترسی داشته باشید.
## LOCALIZATION NOTE (errorSendingRcptCommand): argument %1$S is the Outgoing server (SMTP) response, argument %2$S is the intended message recipient.
errorSendingRcptCommand = هنگام ارسال رایانامه خطایی رخ داد. پاسخ کارساز رایانامه:\n%1$S.\nلطفاً گیرندهٔ پیام «%2$S» را بررسی کنید و دوباره تلاش کنید.
## LOCALIZATION NOTE (startTlsFailed): argument %S is the Outgoing server (SMTP)
startTlsFailed = هنگام ارسال رایانامه خطایی رخ داد: برقراری پیوند امن با کارساز خروجی (SMTP) %S با STARTTLS ممکن نیست، چون این کارساز چنین قابلیتی اعلام نمی‌کند. STARTTLS را برای آن کارساز خاموش کنید یا با ارائه‌دهندهٔ خدمات خود تماس بگیرید.
## LOCALIZATION NOTE (smtpTooManyRecipients): argument %s is the Outgoing server (SMTP) response
smtpTooManyRecipients = پیام ارسال نشد، چون تعداد گیرندگان از حد مجاز بیشتر بود. پاسخ کارساز: %s.
## LOCALIZATION NOTE (smtpPermSizeExceeded2): argument %s is the Outgoing server (SMTP) response
smtpPermSizeExceeded2 = اندازهٔ پیامی که می‌خواهید ارسال کنید از محدودیت کلی اندازه در کارساز بیشتر است. پیام ارسال نشد؛ اندازهٔ پیام را کاهش دهید و دوباره تلاش کنید. پاسخ کارساز:  %s.
## LOCALIZATION NOTE (smtpSendFailedUnknownServer): argument %S is the Outgoing server (SMTP)
smtpSendFailedUnknownServer = هنگام ارسال رایانامه خطایی رخ داد: کارساز خروجی (SMTP) %S ناشناخته است. ممکن است کارساز نادرست پیکربندی شده باشد. لطفاً درستی تنظیمات کارساز خروجی (SMTP) را بررسی کنید و دوباره تلاش کنید.
## LOCALIZATION NOTE (smtpSendRequestRefused): argument %S is the Outgoing server (SMTP)
smtpSendRequestRefused = پیام ارسال نشد، چون اتصال به کارساز خروجی (SMTP) %S ناموفق بود. ممکن است کارساز در دسترس نباشد یا اتصال‌های SMTP را رد کند. لطفاً درستی تنظیمات کارساز خروجی (SMTP) را بررسی کنید و دوباره تلاش کنید.
## LOCALIZATION NOTE (smtpSendInterrupted): argument %S is the Outgoing server (SMTP)
smtpSendInterrupted = پیام ارسال نشد، چون اتصال به کارساز خروجی (SMTP) %S در میانهٔ تراکنش قطع شد. دوباره تلاش کنید.
## LOCALIZATION NOTE (smtpSendTimeout): argument %S is the Outgoing server (SMTP)
smtpSendTimeout = پیام ارسال نشد، چون مهلت اتصال به کارساز خروجی (SMTP) %S به پایان رسید. دوباره تلاش کنید.
# LOCALIZATION NOTE (smtpHintAuthEncryptToPlainNoSsl): %S is the server hostname
smtpHintAuthEncryptToPlainNoSsl = به نظر می‌رسد کارساز خروجی (SMTP) %S از گذرواژه‌های رمزگذاری‌شده پشتیبانی نمی‌کند. اگر تازه حساب را راه‌اندازی کرده‌اید، «روش احراز هویت» را در «تنظیمات حساب | کارساز خروجی (SMTP)» به «گذرواژه، ارسال ناامن» تغییر دهید. اگر قبلاً کار می‌کرد ولی اکنون کار نمی‌کند، ممکن است در معرض سرقت گذرواژه باشید.
# LOCALIZATION NOTE (smtpHintAuthEncryptToPlainSsl): %S is the server hostname
smtpHintAuthEncryptToPlainSsl = به نظر می‌رسد کارساز خروجی (SMTP) %S از گذرواژه‌های رمزگذاری‌شده پشتیبانی نمی‌کند. اگر تازه حساب را راه‌اندازی کرده‌اید، «روش احراز هویت» را در «تنظیمات حساب | کارساز خروجی (SMTP)» به «گذرواژهٔ عادی» تغییر دهید.
# LOCALIZATION NOTE (smtpHintAuthPlainToEncrypt): %S is the server hostname
smtpHintAuthPlainToEncrypt = کارساز خروجی (SMTP) %S گذرواژه‌های متن ساده را نمی‌پذیرد. لطفاً «روش احراز هویت» را در «تنظیمات حساب | کارساز خروجی (SMTP)» به «گذرواژهٔ رمزگذاری‌شده» تغییر دهید.
# LOCALIZATION NOTE (smtpAuthFailure): %S is the server hostname
smtpAuthFailure = احراز هویت با کارساز خروجی (SMTP) %S ممکن نیست. لطفاً گذرواژه را بررسی کنید و «روش احراز هویت» را در «تنظیمات حساب | کارساز خروجی (SMTP)» بازبینی کنید.
# LOCALIZATION NOTE (smtpAuthGssapi): %S is the server hostname
smtpAuthGssapi = کارساز خروجی (SMTP) %S بلیت Kerberos/GSSAPI را نپذیرفت. لطفاً بررسی کنید که به قلمرو Kerberos/GSSAPI وارد شده باشید.
# LOCALIZATION NOTE (smtpAuthMechNotSupported): %S is the server hostname
smtpAuthMechNotSupported = کارساز خروجی (SMTP) %S از روش احراز هویت انتخاب‌شده پشتیبانی نمی‌کند. لطفاً «روش احراز هویت» را در «تنظیمات حساب | کارساز خروجی (SMTP)» تغییر دهید.
# LOCALIZATION NOTE (errorIllegalLocalPart2): %s is an email address with an illegal localpart
errorIllegalLocalPart2 = بخش محلی نشانی گیرندهٔ %s نویسه‌های غیر ASCII دارد و کارساز شما از SMTPUTF8 پشتیبانی نمی‌کند. لطفاً این نشانی را تغییر دهید و دوباره تلاش کنید.
