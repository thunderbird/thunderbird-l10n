malformedURI2 = لطفاً درستی نشانی را بررسی کنید و دوباره تلاش کنید.
fileNotFound = پروندهٔ %S پیدا نشد. لطفاً مکان را بررسی کنید و دوباره تلاش کنید.
fileAccessDenied = پرونده در %S قابل خواندن نیست.
# %S is replaced by the uri host
httpErrorPage = %S خطا برگرداند.
serverError = ممکن است %S مشکل موقتی داشته باشد یا جابه‌جا شده باشد.
dnsNotFound2 = %S پیدا نشد. لطفاً نام را بررسی کنید و دوباره تلاش کنید.
basicHttpAuthDisabled = ممکن است کسی محتوا را جعل کرده باشد و بخواهد اطلاعاتی مانند نام کاربری، گذرواژه یا رایانامهٔ شما را بدزدد. همچنین ممکن است تنظیمات اتصال شما نادرست باشد.
unknownProtocolFound = یکی از موارد زیر (%S) پروتکل ثبت‌شده‌ای نیست یا در این زمینه مجاز نیست.
connectionFailure = هنگام تلاش برای ارتباط با %S، اتصال رد شد.
netInterrupt = اتصال به %S به‌طور غیرمنتظره قطع شد. ممکن است بخشی از داده‌ها منتقل شده باشد.
netTimeout = هنگام تلاش برای ارتباط با %S، مهلت عملیات به پایان رسید.
redirectLoop = از محدودیت تغییر مسیر برای این نشانی فراتر رفت. بارگذاری محتوای درخواست‌شده ممکن نیست. ممکن است علت آن کلوچک‌های مسدودشده باشد.
confirmRepostPrompt = برای نمایش این محتوا، Thunderbird باید اطلاعاتی را بفرستد که هر کاری را که قبلاً انجام شده (مانند جست‌وجو یا تأیید سفارش) تکرار می‌کند.
resendButton.label = ارسال دوباره
clientSocketMisconfiguration = Thunderbird نمی‌داند چگونه با کارساز ارتباط برقرار کند.
netReset = سند هیچ داده‌ای ندارد.
notCached = این سند دیگر در دسترس نیست.
netOffline = Thunderbird در حال حاضر در حالت برون‌خط است و نمی‌تواند به اینترنت متصل شود.
isprinting = هنگام چاپ یا پیش‌نمایش چاپ، سند نمی‌تواند تغییر کند.
deniedPortAccess = دسترسی به شمارهٔ درگاه داده‌شده به دلایل امنیتی از‌کار افتاده است.
proxyResolveFailure = کارساز پیشکاری که پیکربندی کرده‌اید پیدا نشد. لطفاً تنظیمات پیشکار را بررسی کنید و دوباره تلاش کنید.
proxyConnectFailure = هنگام تلاش برای ارتباط با کارساز پیشکاری که پیکربندی کرده‌اید، اتصال رد شد. لطفاً تنظیمات پیشکار را بررسی کنید و دوباره تلاش کنید.
contentEncodingError = محتوایی که می‌خواهید ببینید نمایش داده نمی‌شود، چون از روش فشرده‌سازی نامعتبر یا پشتیبانی‌نشده‌ای استفاده می‌کند.
unsafeContentType = محتوایی که می‌خواهید ببینید نمایش داده نمی‌شود، چون در نوع پرونده‌ای قرار دارد که گشودنش ممکن است امن نباشد. لطفاً با صاحبان کارساز تماس بگیرید و این مشکل را به آن‌ها اطلاع دهید.
malwareBlocked = گزارش شده که از کارساز %S برای حمله استفاده شده و بر اساس تنظیمات امنیتی شما مسدود شده است.
harmfulBlocked = محتوای %S به‌عنوان احتمالاً زیان‌آور گزارش شده و بر اساس تنظیمات امنیتی شما مسدود شده است.
unwantedBlocked = گزارش شده که کارساز %S نرم‌افزار ناخواسته ارائه می‌دهد و بر اساس تنظیمات امنیتی شما مسدود شده است.
deceptiveBlocked = محتوای %S به‌عنوان فریبنده گزارش شده و بر اساس تنظیمات امنیتی شما مسدود شده است.
cspBlocked = این صفحه یک سیاست امنیت محتوا دارد که از بارگذاری آن به این شکل جلوگیری می‌کند.
xfoBlocked = این صفحه یک سیاست X-Frame-Options دارد که از بارگذاری آن در این زمینه جلوگیری می‌کند.
corruptedContentErrorv2 = کارساز در %S دچار نقض پروتکل شبکه شده که قابل تعمیر نیست.
sslv3Used = امنیت داده‌های شما در %S تضمین نمی‌شود، چون از SSLv3 استفاده می‌کند که پروتکل امنیتی ناکارآمدی است.
weakCryptoUsed = مالک %S کارساز خود را نادرست پیکربندی کرده است. برای محافظت از اطلاعات شما در برابر سرقت، اتصال به این کارساز برقرار نشد.
inadequateSecurityError = کارساز تلاش کرد سطح امنیت ناکافی‌ای را برقرار کند.
blockedByPolicy = سازمان شما دسترسی به این محتوا را مسدود کرده است.
blockedByCORP = این محتوا بارگذاری نشد، چون به نظر می‌رسد پیکربندی امنیتی با درخواست قبلی مطابقت ندارد.
invalidHeaderValue = %S سرایندی با نویسه‌های خالی برگرداند که استانداردهای امنیت وب اجازه نمی‌دهند.
networkProtocolError = Thunderbird دچار نقض پروتکل شبکه شده که قابل تعمیر نیست.
