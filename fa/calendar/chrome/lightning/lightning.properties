imipHtml.organizer = برگزارکننده:
imipHtml.description = شرح:
# LOCALIZATION_NOTE(imipHtml.attachments): This is a label for one or more (additional) links to
# documents or websites attached to this event.
imipHtml.attachments = پیوست‌ها:
imipHtml.comment = دیدگاه:
imipHtml.attendees = شرکت‌کنندگان:
